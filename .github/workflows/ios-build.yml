name: iOS Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run tests
        run: |
          # Newest available iPhone simulator on the runner
          DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries | sort_by(.key) | reverse | .[]
             | select(.key | contains("iOS")) | .value[]
             | select(.name | startswith("iPhone"))][0].udid')
          echo "Simulator: $DEVICE_ID"
          xcodebuild \
            -project Aska.xcodeproj \
            -scheme Aska \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Aska.xcodeproj \
            -scheme Aska \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Aska.app Payload/
          zip -qry Aska-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Aska-unsigned-ipa
          path: Aska-unsigned.ipa
